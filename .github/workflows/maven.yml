name: Сборка и Релиз JailPlugin

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Скачивание репозитория
      uses: actions/checkout@v4

    - name: Установка Java 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'oracle' # Используем Oracle, так как ваш сервер работает на нем
        cache: maven

    - name: Сборка проекта через Maven
      run: mvn -B clean package --file pom.xml

    - name: Сохранение скомпилированного плагина (Артефакт)
      uses: actions/upload-artifact@v4
      with:
        name: JailPlugin-Build
        path: target/JailPlugin-*.jar

    - name: Создание GitHub Релиза (только при создании тега)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Релиз ${{ github.ref_name }}
        body: |
          Автоматическая сборка плагина **JailPlugin** от **dagxam**.
          
          ✅ Сборка под Java 26 успешно завершена. Плагин готов к работе на сервере.
          ⬇️ Скачайте готовый `.jar` файл в разделе **Assets** ниже.
        files: target/JailPlugin-*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
