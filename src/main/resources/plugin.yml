# Основное описание плагина.
# Названия команд оставлены на английском для удобства.

name: JailPlugin
version: 2.0.0
main: com.jail.JailPlugin
api-version: '26.2'

description: Система тюрьмы с камерами, сроками и автоматическими наказаниями
author: dagxam

commands:

  # Основная команда управления тюрьмой.
  prison:
    description: Управление системой тюрьмы
    permission: prison.admin
    usage: /prison <jail|release|list|tp|setcell|setrelease|cells|removecell|reload>

  # Просмотр оставшегося срока.
  jailtime:
    description: Показать оставшееся время заключения
    aliases:
      - срок
      - jail

  # Просмотр координат.
  getcoords:
    description: Показать текущие координаты
    permission: prison.admin
    usage: /getcoords

permissions:

  # Полный доступ администратора.
  prison.admin:
    description: Полный доступ к управлению системой тюрьмы
    default: op

  # Защита от автоматического заключения.
  prison.bypass:
    description: Защита игрока от автоматического заключения
    default: false
