name: JailPlugin
version: 2.0.0
main: com.jail.JailPlugin
api-version: '26.2'

description: Система тюрьмы с автоматическими наказаниями, камерами и таймером
author: dagxam

commands:

  prison:
    description: Управление тюрьмой
    permission: prison.admin
    usage: /prison <jail|release|list|tp|setcell|setrelease|cells|removecell|reload>

  jailtime:
    description: Узнать оставшийся срок
    aliases:
      - срок
      - jail

  getcoords:
    description: Показать координаты
    permission: prison.admin
    usage: /getcoords

permissions:

  prison.admin:
    description: Полный доступ к управлению тюрьмой
    default: op

  prison.bypass:
    description: Иммунитет от автоматической тюрьмы
    default: false
