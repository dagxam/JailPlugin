# ============================================================
# JailPlugin — настройки системы тюрьмы
# ============================================================


# ============================================================
# КАМЕРЫ
# ============================================================
#
# Камеры можно создавать прямо в игре:
#
# /prison setcell
# /prison setcell cell-2
# /prison setcell cell-3
#
# Если название не указано, будет создано следующее:
#
# cell-1
# cell-2
# cell-3
#
# Игрок при заключении будет помещён
# в одну из доступных камер случайным образом.
#

cells: {}


# ============================================================
# ТОЧКА ОСВОБОЖДЕНИЯ
# ============================================================
#
# После окончания срока игрок будет телепортирован сюда.
#
# Настраивается командой:
#
# /prison setrelease
#

release:

  world: "world"

  x: 0.5

  y: 64.0

  z: 0.5

  yaw: 0.0

  pitch: 0.0


# ============================================================
# СРОКИ НАКАЗАНИЯ
# ============================================================
#
# Все значения указываются в секундах.
#
# 60 секунд = 1 минута
# 300 секунд = 5 минут
# 600 секунд = 10 минут
#

sentences:

  # Убийство другого игрока.
  player-kill: 360

  # Убийство жителя.
  villager-kill: 180

  # Убийство железного голема.
  golem-kill: 180

  # Убийство странствующего торговца.
  trader-kill: 120

  # Стандартный срок.
  default: 600


# ============================================================
# РАДИУС КАМЕРЫ
# ============================================================
#
# Максимальное расстояние, на которое заключённый
# может отойти от центра своей камеры.
#

cell-radius: 3.0


# ============================================================
# ОБЩЕЕ СООБЩЕНИЕ ОБ АРЕСТЕ
# ============================================================

broadcast-arrests: true


# ============================================================
# КОМАНДЫ, РАЗРЕШЁННЫЕ В ТЮРЬМЕ
# ============================================================
#
# Эти команды заключённый может использовать.
#

allowed-commands:

  - "jailtime"

  - "срок"


# ============================================================
# СООБЩЕНИЯ
# ============================================================

messages:


  # ----------------------------------------------------------
  # АВТОМАТИЧЕСКИЙ АРЕСТ
  # ----------------------------------------------------------

  arrest-header: "&c&l⛓ ВЫ ЗАКЛЮЧЕНЫ В ТЮРЬМУ! ⛓"

  arrest-reason: "&7Причина: &f%reason%"

  arrest-time: "&7Назначенный срок: &f%time%"

  arrest-cell: "&7Камера: &f%cell%"


  # ----------------------------------------------------------
  # ПРИЧИНЫ НАКАЗАНИЯ
  # ----------------------------------------------------------

  reason-player-kill: "убийство игрока"

  reason-villager-kill: "убийство жителя"

  reason-golem-kill: "убийство железного голема"

  reason-trader-kill: "убийство странствующего торговца"


  # ----------------------------------------------------------
  # СООБЩЕНИЕ ВСЕМ ИГРОКАМ
  # ----------------------------------------------------------

  broadcast-arrest: "&c☠ &f%player% &7заключён в тюрьму за &c%reason%&7!"


  # ----------------------------------------------------------
  # ТАЙМЕР
  # ----------------------------------------------------------

  actionbar-timer: "&c⛓ До освобождения: &f%time%&c ⛓"


  # ----------------------------------------------------------
  # ОСВОБОЖДЕНИЕ
  # ----------------------------------------------------------

  release-chat: "&a&l✓ ВЫ ОСВОБОЖДЕНЫ! ✓"

  release-title: "&a&lСвобода!"

  release-subtitle: "&7Ваш срок закончился."


  # ----------------------------------------------------------
  # ПОВТОРНЫЙ ВХОД
  # ----------------------------------------------------------

  join-still-jailed: "&c⛓ Вы всё ещё находитесь в тюрьме!"

  join-still-jailed-time: "&7До освобождения осталось: &f%time%"


  # ----------------------------------------------------------
  # ЗАПРЕЩЁННЫЕ ДЕЙСТВИЯ
  # ----------------------------------------------------------

  commands-blocked: "&c⛓ В тюрьме эта команда запрещена!"

  block-break-blocked: "&c⛓ В тюрьме нельзя ломать блоки!"

  block-place-blocked: "&c⛓ В тюрьме нельзя устанавливать блоки!"

  damage-blocked: "&c⛓ В тюрьме нельзя атаковать игроков!"

  drop-blocked: "&c⛓ В тюрьме нельзя выбрасывать предметы!"

  pickup-blocked: "&c⛓ В тюрьме нельзя подбирать предметы!"


  # ----------------------------------------------------------
  # /JAILTIME
  # ----------------------------------------------------------

  jailtime-remaining: "&c⛓ До освобождения осталось: &f%time%"

  jailtime-free: "&a✓ Вы не находитесь в тюрьме."


  # ----------------------------------------------------------
  # АДМИНИСТРАТОР
  # ----------------------------------------------------------

  admin-jailed: "&a✓ Игрок &f%player% &aзаключён на &f%time%."

  admin-released: "&a✓ Игрок &f%player% &aосвобождён."

  admin-not-jailed: "&cЭтот игрок не находится в тюрьме."

  admin-player-not-found: "&cИгрок не найден или сейчас не в сети."

  admin-reloaded: "&a✓ Настройки тюрьмы успешно перезагружены."

  admin-tp: "&a✓ Вы телепортированы в случайную камеру."

  admin-jail-notify: "&c⛓ Вы заключены в тюрьму администратором."

  admin-release-notify: "&a✓ Администратор освободил вас из тюрьмы."


  # ----------------------------------------------------------
  # СПИСОК ЗАКЛЮЧЁННЫХ
  # ----------------------------------------------------------

  admin-list-header: "&6&l⛓ Заключённые:"

  admin-list-entry: "&7• &f%player% &7— осталось: &f%time%"

  admin-list-empty: "&7В данный момент в тюрьме никого нет."


  # ----------------------------------------------------------
  # КАМЕРЫ
  # ----------------------------------------------------------

  cell-added: "&a✓ Камера &f%cell% &aуспешно установлена."

  cell-removed: "&a✓ Камера &f%cell% &aудалена."

  cell-not-found: "&cКамера &f%cell% &cне найдена."

  cell-list: "&eНастроено камер: &f%count%"

  cell-list-entry: "&7• &f%cell%"

  no-cells: "&c⛓ Камеры тюрьмы не настроены!"

  no-cells-hint: "&7Создайте камеру командой: &f/prison setcell"


  # ----------------------------------------------------------
  # ТОЧКА ОСВОБОЖДЕНИЯ
  # ----------------------------------------------------------

  release-set: "&a✓ Точка освобождения успешно установлена."


  # ----------------------------------------------------------
  # ОШИБКИ
  # ----------------------------------------------------------

  no-permission: "&cУ вас недостаточно прав."

  player-only: "&cЭта команда доступна только игрокам."

  invalid-number: "&cНеобходимо указать число."

  unknown-command: "&cНеизвестная команда."

  usage-jail: "&eИспользование: &f/prison jail <игрок> [минуты]"

  usage-release: "&eИспользование: &f/prison release <игрок>"

  usage-setcell: "&eИспользование: &f/prison setcell [название]"

  usage-removecell: "&eИспользование: &f/prison removecell <название>"
