# ============================================================
# JailPlugin
# Система тюрьмы для Minecraft
# ============================================================
#
# Команды плагина оставлены на английском:
#
# /prison
# /jailtime
# /getcoords
#
# Все сообщения для игроков и администратора
# находятся в этом файле.
#
# После изменения настроек можно выполнить:
#
# /prison reload
#
# ============================================================


# ============================================================
# КАМЕРЫ
# ============================================================
#
# Камеры создаются непосредственно в игре.
#
# Создать камеру с автоматическим названием:
#
# /prison setcell
#
# Будет создано:
#
# cell-1
# cell-2
# cell-3
#
# Создать камеру с собственным названием:
#
# /prison setcell cell-1
# /prison setcell vip
# /prison setcell cell-big
#
# Не нужно вручную вписывать камеры сюда,
# если ты создаёшь их командами.
#
# После создания структура будет примерно такой:
#
# cells:
#   cell-1:
#     world: world
#     x: 100.5
#     y: 65.0
#     z: -20.5
#     yaw: 0.0
#     pitch: 0.0
#

cells: {}


# ============================================================
# ТОЧКА ОСВОБОЖДЕНИЯ
# ============================================================
#
# После окончания срока игрок будет
# телепортирован в эту точку.
#
# Установить точку можно командой:
#
# /prison setrelease
#
# Команду нужно выполнить в том месте,
# куда должны попадать освобождённые игроки.
#

release:

  world: "world"

  x: 0.5

  y: 64.0

  z: 0.5

  yaw: 0.0

  pitch: 0.0


# ============================================================
# СРОКИ НАКАЗАНИЯ
# ============================================================
#
# Все значения указываются в секундах.
#
# 60   = 1 минута
# 120  = 2 минуты
# 300  = 5 минут
# 600  = 10 минут
#
# Эти сроки используются при автоматическом
# наказании за убийство определённых сущностей.
#

sentences:

  # Убийство другого игрока.
  player-kill: 360

  # Убийство жителя.
  villager-kill: 180

  # Убийство железного голема.
  golem-kill: 180

  # Убийство странствующего торговца.
  trader-kill: 120

  # Срок по умолчанию.
  #
  # Также используется командой:
  #
  # /prison jail <игрок>
  #
  default: 600


# ============================================================
# РАДИУС КАМЕРЫ
# ============================================================
#
# Заключённый не сможет отойти дальше
# указанного количества блоков от центра камеры.
#
# Например:
#
# 3.0 = радиус 3 блока
# 5.0 = радиус 5 блоков
# 10.0 = радиус 10 блоков
#
# Важно:
#
# Сейчас это именно радиус вокруг точки камеры,
# а не прямоугольная область помещения.
#

cell-radius: 3.0


# ============================================================
# СООБЩЕНИЕ ОБ АВТОМАТИЧЕСКОМ АРЕСТЕ
# ============================================================
#
# true  = сообщение видят все игроки
# false = сообщение видит только нарушитель
#

broadcast-arrests: true


# ============================================================
# КОМАНДЫ, РАЗРЕШЁННЫЕ В ТЮРЬМЕ
# ============================================================
#
# Заключённый сможет использовать только команды,
# перечисленные здесь.
#
# Названия указываются без "/".
#
# Например:
#
# jailtime
# срок
#
# Всё остальное будет заблокировано.
#

allowed-commands:

  - "jailtime"

  - "срок"


# ============================================================
# СООБЩЕНИЯ
# ============================================================

messages:


  # ==========================================================
  # АРЕСТ
  # ==========================================================

  arrest-header: "&c&l⛓ ВЫ ЗАКЛЮЧЕНЫ В ТЮРЬМУ! ⛓"

  arrest-reason: "&7Причина: &f%reason%"

  arrest-time: "&7Назначенный срок: &f%time%"

  arrest-cell: "&7Камера: &f%cell%"


  # ==========================================================
  # ПРИЧИНЫ АВТОМАТИЧЕСКОГО НАКАЗАНИЯ
  # ==========================================================

  reason-player-kill: "убийство игрока"

  reason-villager-kill: "убийство жителя"

  reason-golem-kill: "убийство железного голема"

  reason-trader-kill: "убийство странствующего торговца"


  # ==========================================================
  # ОБЩЕЕ СООБЩЕНИЕ ОБ АРЕСТЕ
  # ==========================================================

  broadcast-arrest: "&c☠ &f%player% &7заключён в тюрьму за &c%reason%&7!"


  # ==========================================================
  # ТАЙМЕР
  # ==========================================================

  actionbar-timer: "&c⛓ До освобождения: &f%time%&c ⛓"


  # ==========================================================
  # ОСВОБОЖДЕНИЕ
  # ==========================================================

  release-chat: "&a&l✓ ВЫ ОСВОБОЖДЕНЫ! ✓"

  release-title: "&a&lСвобода!"

  release-subtitle: "&7Ваш срок закончился."


  # ==========================================================
  # ВХОД НА СЕРВЕР
  # ==========================================================

  join-still-jailed: "&c⛓ Вы всё ещё находитесь в тюрьме!"

  join-still-jailed-time: "&7До освобождения осталось: &f%time%"


  # ==========================================================
  # ПЕРЕМЕЩЕНИЕ
  # ==========================================================

  movement-blocked: "&c⛓ Вы не можете покинуть свою камеру!"


  # ==========================================================
  # ЗАПРЕЩЁННЫЕ ДЕЙСТВИЯ
  # ==========================================================

